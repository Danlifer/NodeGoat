version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - node -v
      - npm -v

  pre_build:
    commands:
      - npm install --legacy-peer-deps || echo "Advertencia en la instalacion"

  build:
    commands:
      - npm audit --audit-level=high || echo "Vulnerabilidades detectadas"
      - grep -rn "password" app/ || echo "Revision finalizada"
